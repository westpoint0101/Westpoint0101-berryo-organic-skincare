  <body>
    <div id="root"></div>
    <a
      class="whatsapp-plugin"
      href="https://wa.me/2348034226547?text=Hello%20BERRYO%20Organic%20Skincare%2C%20I%20need%20help%20with%20an%20order."
      target="_blank"
      rel="noreferrer"
      aria-label="Chat with BERRYO Organic Skincare on WhatsApp"
    >
      <span aria-hidden="true">WhatsApp</span>
      <span>Chat with us</span>
    </a>
    
    <script>
      localStorage.removeItem('berryo-whatsapp-position');
      localStorage.removeItem('berryo-ai-position');
      (() => {
        const catalogMaxPrice = Math.max(
          ...(window.BERRYO_CATALOG || []).map((product) => Number(product.price) || 0),
        );
        const initializedPriceRanges = new WeakSet();
        const showFullCatalog = () => {
          if (!catalogMaxPrice) return;
          document.querySelectorAll('input[type="range"]').forEach((input) => {
            if (initializedPriceRanges.has(input)) return;
            initializedPriceRanges.add(input);
            input.max = String(catalogMaxPrice);
            const valueSetter = Object.getOwnPropertyDescriptor(
              HTMLInputElement.prototype,
              'value',
            )?.set;
            if (!valueSetter) throw new Error('The storefront price filter could not be initialized.');
            valueSetter.call(input, String(catalogMaxPrice));
            input.dispatchEvent(new Event('input', { bubbles: true }));
          });
        };

        const createEditorialPanel = (className, eyebrowText, headingText, bodyText, noteText) => {
          const panel = document.createElement('aside');
          panel.className = className;
          const eyebrow = document.createElement('p');
          eyebrow.className = 'eyebrow';
          eyebrow.textContent = eyebrowText;
          const heading = document.createElement('h4');
          heading.textContent = headingText;
          const body = document.createElement('p');
          body.textContent = bodyText;
          panel.append(eyebrow, heading, body);
          if (noteText) {
            const note = document.createElement('p');
            note.className = 'track-note';
            note.textContent = noteText;
            panel.appendChild(note);
          }
          return panel;
        };

        const decoratePremiumPages = () => {
          const loginShell = document.querySelector('#login-page .auth-shell');
          const loginCard = loginShell?.querySelector('.auth-card');
          if (loginShell && loginCard && !loginShell.querySelector('.auth-brand-panel')) {
            const panel = createEditorialPanel(
              'auth-brand-panel',
              'BERRYO · ORGANIC SKINCARE',
              'A ritual of care, made personal.',
              'Sign in to keep your BERRYO essentials close and make every self-care moment feel considered.',
            );
            loginShell.insertBefore(panel, loginCard);
          }

          const wholesaleGrid = document.querySelector('#wholesale-page .wholesale-page-grid');
          const wholesaleCopy = wholesaleGrid?.querySelector('.wholesale-copy');
          const wholesaleForm = wholesaleGrid?.querySelector('.wholesale-form');
          if (wholesaleGrid && wholesaleCopy && wholesaleForm) {
            if (!wholesaleGrid.querySelector('.wholesale-visual')) {
              wholesaleGrid.insertBefore(createEditorialPanel(
                'wholesale-visual',
                'BERRYO · TRADE',
                'Good things grow together.',
                'Thoughtful skincare for the businesses bringing everyday care to more people.',
              ), wholesaleCopy);
            }
            if (!wholesaleForm.querySelector('.wholesale-form-heading')) {
              const heading = document.createElement('div');
              heading.className = 'wholesale-form-heading';
              const eyebrow = document.createElement('p');
              eyebrow.className = 'eyebrow';
              eyebrow.textContent = 'Start a conversation';
              const title = document.createElement('h4');
              title.textContent = 'Tell us about your business';
              heading.append(eyebrow, title);
              wholesaleForm.prepend(heading);
            }
          }

          const trackingBox = document.querySelector('#track-page .track-page-box');
          const trackingForm = trackingBox?.querySelector('.track-form');
          if (trackingBox && trackingForm && !trackingBox.querySelector('.track-visual')) {
            trackingBox.insertBefore(createEditorialPanel(
              'track-visual',
              'BERRYO · ORDER CARE',
              'Your order, at a glance.',
              'Enter the order code from your confirmation to check its journey.',
              'Need a hand? Contact our customer care team and have your order code ready.',
            ), trackingForm);
          }
        };

        const clarifyGuestCheckout = () => {
          const note = document.querySelector('#cart-page .cart-checkout-panel > .auth-copy');
          const customer = window.BERRYO_CUSTOMER_PROFILE;
          if (note && (note.textContent.trim().startsWith('Checkout account:')
            || note.textContent.trim().startsWith('Guest checkout')
            || note.textContent.trim().startsWith('Signed-in checkout'))) {
            note.textContent = customer
              ? 'Signed-in checkout for ' + String(customer.email || customer.phone || 'your customer account') + '. Confirm your delivery details, then send your order to BERRYO on WhatsApp.'
              : 'Guest checkout — no account required. Add your delivery details to send your order to BERRYO on WhatsApp.';
          }
          if (!customer) return;
          const metadata = customer.user_metadata || {};
          const values = [
            metadata.full_name || '',
            customer.email || '',
            customer.phone || metadata.phone || '',
            metadata.delivery_address || '',
          ];
          const inputs = document.querySelectorAll('#cart-page .checkout-form input');
          inputs.forEach((input, index) => {
            const value = values[index];
            if (!value || input.value) return;
            const prototype = input instanceof HTMLTextAreaElement
              ? HTMLTextAreaElement.prototype
              : HTMLInputElement.prototype;
            const setter = Object.getOwnPropertyDescriptor(prototype, 'value')?.set;
            if (!setter) throw new Error('Saved customer details could not be added to checkout.');
            setter.call(input, value);
            input.dispatchEvent(new Event('input', { bubbles: true }));
          });
        };

        const readSavedWishlist = () => {
          try {
            const saved = JSON.parse(localStorage.getItem('berryo-wishlist') || '[]');
            return Array.isArray(saved) ? saved : [];
          } catch (error) {
            console.error('BERRYO wishlist could not be read.', error);
            return [];
          }
        };
        window.BERRYO_READ_WISHLIST = readSavedWishlist;

        const syncWishlistCards = () => {
          const savedIds = readSavedWishlist();
          document.querySelectorAll('.product-card').forEach((card) => {
            const name = card.querySelector('h4')?.textContent.trim();
            const product = (window.BERRYO_CATALOG || []).find((item) => item.name === name);
            const button = card.querySelector('.wishlist-heart');
            if (product && button && savedIds.includes(product.id) && !button.textContent.includes('\u2665')) {
              button.click();
            }
          });
        };

        document.addEventListener('click', (event) => {
          const button = event.target instanceof Element
            ? event.target.closest('.product-card .wishlist-heart')
            : null;
          if (!button) return;
          window.setTimeout(() => {
            const name = button.closest('.product-card')?.querySelector('h4')?.textContent.trim();
            const product = (window.BERRYO_CATALOG || []).find((item) => item.name === name);
            if (!product) return;
            const saved = readSavedWishlist().filter((id) => id !== product.id);
            if (button.textContent.includes('\u2665')) saved.push(product.id);
            try {
              localStorage.setItem('berryo-wishlist', JSON.stringify(saved));
            } catch (error) {
              console.error('BERRYO wishlist could not be saved.', error);
            }
          }, 0);
        });

        const placeHeaderActions = () => {
          showFullCatalog();
          decoratePremiumPages();
          clarifyGuestCheckout();
          syncWishlistCards();
          const tools = document.querySelector('.header-tools');
          const whatsapp = document.querySelector('.whatsapp-plugin');
          const ai = document.querySelector('.ai-assistant');
          if (!tools || !whatsapp || !ai) return;

          const firstSelect = tools.querySelector('select');
          if (whatsapp.parentElement !== tools) tools.insertBefore(whatsapp, firstSelect);
          const emailAction = Array.from(document.querySelectorAll('.action-row a'))
            .find((action) => action.textContent?.trim() === 'Email us');
          if (emailAction && ai.parentElement !== emailAction.parentElement) {
            emailAction.parentElement.insertBefore(ai, emailAction);
          }
        };

        new MutationObserver(placeHeaderActions).observe(document.body, {
          childList: true,
          subtree: true,
        });
        placeHeaderActions();
      })();
      (() => {
        const readJson = (key, fallback) => {
          try {
            return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback));
          } catch {
            return fallback;
          }
        };

        const createInput = (type, placeholder, value = '') => {
          const input = document.createElement('input');
          input.type = type;
          input.placeholder = placeholder;
          input.value = value;
          return input;
        };

        const addAdminExtensions = () => {
          const settingsPanel = Array.from(document.querySelectorAll('.admin-panel'))
            .find((panel) => panel.querySelector('h4')?.textContent?.trim() === 'Store settings');
          const productPanel = Array.from(document.querySelectorAll('.admin-panel'))
            .find((panel) => panel.querySelector('h4')?.textContent?.trim() === 'Product editor');

          if (!settingsPanel || !productPanel) return;

          if (!settingsPanel.querySelector('.shipping-admin-panel')) {
            const shipping = readJson('berryo-shipping-settings', {
              deliveryFeeNGN: 1800,
              deliveryFeeUSD: 2,
              deliveryInformation: 'Delivery details are confirmed after payment.',
            });
            const panel = document.createElement('section');
            panel.className = 'admin-extension-panel shipping-admin-panel';
            panel.innerHTML = '<h5>Shipping information</h5>';
            const ngn = createInput('number', 'Shipping fee (NGN)', shipping.deliveryFeeNGN);
            const usd = createInput('number', 'Shipping fee (USD and other currencies)', shipping.deliveryFeeUSD);
            const information = document.createElement('textarea');
            information.placeholder = 'Shipping information shown to customers';
            information.rows = 3;
            information.value = shipping.deliveryInformation;
            const save = document.createElement('button');
            save.type = 'button';
            save.className = 'primary-btn small';
            save.textContent = 'Save shipping information';
            save.addEventListener('click', () => {
              localStorage.setItem('berryo-shipping-settings', JSON.stringify({
                deliveryFeeNGN: Number(ngn.value) || 0,
                deliveryFeeUSD: Number(usd.value) || 0,
                deliveryInformation: information.value.trim(),
              }));
              save.textContent = 'Shipping saved';
            });
            panel.append(ngn, usd, information, save);
            settingsPanel.appendChild(panel);
          }

          if (!productPanel.querySelector('.price-admin-panel')) {
            const panel = document.createElement('section');
            panel.className = 'admin-extension-panel price-admin-panel';
            panel.innerHTML = '<h5>NGN and USD product pricing</h5><p class="auth-copy">Set a separate NGN price and USD price. The USD price is the reference price for all non-NGN currencies.</p>';
            const ngn = createInput('number', 'NGN price');
            const usd = createInput('number', 'USD price for all non-NGN currencies');
            const save = document.createElement('button');
            save.type = 'button';
            save.className = 'primary-btn small';
            save.textContent = 'Save selected product prices';
            const loadSelectedProduct = () => {
              const selectedName = productPanel.querySelector('.admin-product-item.active')?.textContent?.trim();
              const products = readJson('berryo-products', []);
              const product = products.find((item) => item.name === selectedName) || products[0];
              if (!product) return;
              ngn.value = String(product.price || '');
              usd.value = String(product.usdPrice || '');
              panel.dataset.productId = product.id;
            };
            save.addEventListener('click', () => {
              const products = readJson('berryo-products', []);
              const id = panel.dataset.productId;
              const updated = products.map((product) => product.id === id
                ? { ...product, price: Number(ngn.value) || 0, usdPrice: Number(usd.value) || 0 }
                : product);
              localStorage.setItem('berryo-products', JSON.stringify(updated));
              save.textContent = 'Prices saved - refresh shop to apply';
            });
            productPanel.addEventListener('click', () => setTimeout(loadSelectedProduct, 0));
            panel.append(ngn, usd, save);
            productPanel.appendChild(panel);
            loadSelectedProduct();
          }

          if (!settingsPanel.querySelector('.purchase-records-panel')) {
            const panel = document.createElement('section');
            panel.className = 'admin-extension-panel purchase-records-panel';
            panel.innerHTML = '<h5>Customer purchase records</h5>';
            const render = () => {
              panel.querySelectorAll('.purchase-record').forEach((record) => record.remove());
              const orders = readJson('berryo-orders', []);
              if (!orders.length) {
                const empty = document.createElement('p');
                empty.className = 'purchase-record';

              });
            };
            const refresh = document.createElement('button');
            refresh.type = 'button';
            refresh.className = 'secondary-btn small';
            refresh.textContent = 'Refresh purchase records';
            refresh.addEventListener('click', render);
            panel.appendChild(refresh);
            settingsPanel.appendChild(panel);
            render();
          }
        };

        new MutationObserver(addAdminExtensions).observe(document.body, {
          childList: true,
          subtree: true,
        });
        addAdminExtensions();
      })();
      (() => {
        const config = window.BERRYO_SUPABASE_CONFIG;

        const setStatus = (container, message, kind) => {
          let status = container.querySelector('.customer-auth-status');
          if (!status) {
            status = document.createElement('p');
            status.className = 'customer-auth-status';
            status.setAttribute('role', 'status');
            container.appendChild(status);
          }
          status.hidden = false;
          status.dataset.kind = kind;
          status.textContent = message;
        };

        const validConfig = () => {
          if (!config?.url || !config?.anonKey) return false;
          try {
            const url = new URL(config.url);
            return (url.protocol === 'https:' || url.hostname === 'localhost') && Boolean(config.anonKey);
          } catch {
            return false;
          }
        };

        const setHeaderCustomer = (user) => {
          window.BERRYO_CUSTOMER_PROFILE = user || null;
          const accountButton = document.querySelector(
            '.header-tools button[aria-label="Account"], .header-tools button.customer-signed-in',
          );
          if (!accountButton) return;
          if (!user) {
            accountButton.textContent = 'ðŸ‘¤';
            accountButton.setAttribute('aria-label', 'Account');
            accountButton.removeAttribute('title');
            accountButton.classList.remove('customer-signed-in');
            return;
          }
          const email = String(user.email || '');
          const identifier = email || String(user.phone || '');
          const displayName = String(user.user_metadata?.full_name || identifier || 'Customer').trim();
          const shortName = displayName.split(/\s+/)[0] || 'Customer';
          accountButton.textContent = 'ðŸ‘¤ ' + shortName;
          accountButton.setAttribute('aria-label', 'Account for ' + (identifier || displayName));
          accountButton.title = identifier || displayName;
          accountButton.classList.add('customer-signed-in');
        };

        const readCustomerSession = () => {
          try {
            return JSON.parse(sessionStorage.getItem('berryo-customer-session') || 'null');
          } catch (error) {
            console.error('BERRYO customer session could not be read.', error);
            return null;
          }
        };

        const saveCustomerSession = (session) => {
          try {
            sessionStorage.setItem('berryo-customer-session', JSON.stringify(session));
            return true;
          } catch (error) {
            console.error('BERRYO customer session could not be saved.', error);
            return false;
          }
        };

        const clearCustomerSession = () => {
          try {
            sessionStorage.removeItem('berryo-customer-session');
          } catch (error) {
            console.error('BERRYO customer session could not be cleared.', error);
            throw new Error('Could not securely sign out in this browser. Please close this tab and try again.');
          }
          setHeaderCustomer(null);
        };

        const makeField = (type, label, autocomplete) => {
          const input = document.createElement('input');
          input.type = type;
          input.placeholder = label;
          input.setAttribute('aria-label', label);
          input.autocomplete = autocomplete;
          input.required = true;
          if (type === 'password') input.minLength = 8;
          return input;
        };

        const addPasswordToggle = (input) => {
          if (!input || input.parentElement?.classList.contains('password-wrap')) return;
          const wrap = document.createElement('span');
          wrap.className = 'password-wrap';
          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'password-toggle';
          toggle.textContent = 'Show';
          toggle.setAttribute('aria-label', 'Show password');
          toggle.setAttribute('aria-pressed', 'false');
          toggle.addEventListener('click', () => {
            const visible = input.type === 'password';
            input.type = visible ? 'text' : 'password';
            toggle.textContent = visible ? 'Hide' : 'Show';
            toggle.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
            toggle.setAttribute('aria-pressed', String(visible));
          });
          input.replaceWith(wrap);
          wrap.append(input, toggle);
        };

        const rememberedLoginKey = 'berryo-remembered-login';
        const readRememberedLogin = () => {
          try {
            return localStorage.getItem(rememberedLoginKey) || '';
          } catch (error) {
            return '';
          }
        };

        const normalizePhoneIdentifier = (value) => {
          const compact = value.trim().replace(/[\s()-]/g, '');
          if (/^0\d{10}$/.test(compact)) return '+234' + compact.slice(1);
          if (/^\d{10}$/.test(compact)) return '+234' + compact;
          if (/^234\d{10}$/.test(compact)) return '+' + compact;
          return compact;
        };

        const renderCustomerAuth = (card) => {
          if (card.dataset.customerAuthReady === 'true'
            && (card.querySelector('.customer-auth-tabs') || card.querySelector('.customer-account-dashboard'))) return;
          card.dataset.customerAuthReady = 'true';
          card.replaceChildren();

          const eyebrow = document.createElement('p');
          eyebrow.className = 'eyebrow accent';
          eyebrow.textContent = 'Customer account';
          const title = document.createElement('h3');
          title.textContent = 'Sign in or create an account';
          const tabs = document.createElement('div');
          tabs.className = 'customer-auth-tabs';
          tabs.setAttribute('role', 'tablist');
          const signInTab = document.createElement('button');
          signInTab.type = 'button';
          signInTab.textContent = 'Sign in';
          signInTab.setAttribute('role', 'tab');
          const createTab = document.createElement('button');
          createTab.type = 'button';
          createTab.textContent = 'Create account';
          createTab.setAttribute('role', 'tab');
          const form = document.createElement('form');
          form.className = 'auth-form';
          const status = document.createElement('p');
          status.className = 'customer-auth-status';
          status.setAttribute('role', 'status');
          status.hidden = true;
          status.dataset.kind = 'info';
          const submit = document.createElement('button');
          submit.type = 'submit';
          submit.className = 'primary-btn';
          const forgot = document.createElement('button');
          forgot.type = 'button';
          forgot.className = 'text-link auth-link customer-auth-secondary';
          forgot.textContent = 'Forgot password?';
          const backToStore = document.createElement('button');
          backToStore.type = 'button';
          backToStore.className = 'customer-guest-action customer-auth-secondary';
          backToStore.textContent = 'Shop and buy without an account';
          backToStore.addEventListener('click', () => {
            const shopButton = Array.from(document.querySelectorAll('.main-nav button'))
              .find((button) => button.textContent.trim() === 'Shop');
            shopButton?.click();
          });
          const guestNote = document.createElement('p');
          guestNote.className = 'customer-guest-note';
          guestNote.textContent = 'No account is needed to order. Browse products, add them to your cart, and send your order to BERRYO on WhatsApp.';

          let mode = 'signin';
          let identifierField;
          let passwordField;
          let confirmPasswordField;
          let rememberBox = null;
          form.addEventListener('submit', () => {
            if (mode !== 'signin' || !rememberBox || !identifierField) return;
            try {
              const identifier = identifierField.value.trim();
              if (rememberBox.checked && identifier) localStorage.setItem(rememberedLoginKey, identifier);
              else localStorage.removeItem(rememberedLoginKey);
            } catch (error) {
              console.error('BERRYO could not update the remembered login.', error);
            }
          });
          let nameField;
          let resendButton;
          let verificationCodeField;
          let pendingPhone = '';
          let recoveryAccessToken = '';
          let resetPasswordField;
          let resetConfirmField;
          let currentAccountView = null;
          const backendReady = validConfig();
          if (!backendReady) {
            status.textContent = '';
          }

          const updateMode = (nextMode) => {
            mode = nextMode;
            signInTab.setAttribute('aria-selected', String(mode === 'signin'));
            createTab.setAttribute('aria-selected', String(mode === 'signup'));
            form.replaceChildren();
            if (mode === 'signup') {
              nameField = makeField('text', 'Full name', 'name');
              form.appendChild(nameField);
            }
            identifierField = makeField('text', mode === 'signup' ? 'Email or phone number' : 'Email or phone', 'username');
            identifierField.inputMode = 'text';
            passwordField = makeField('password', 'Password (at least 8 characters)', mode === 'signup' ? 'new-password' : 'current-password');
            form.append(identifierField, passwordField);
            if (mode === 'signup') {
              confirmPasswordField = makeField('password', 'Confirm password', 'new-password');
              form.appendChild(confirmPasswordField);
            }
            addPasswordToggle(passwordField);
            addPasswordToggle(confirmPasswordField);
            rememberBox = null;
            if (mode === 'signin') {
              const remembered = readRememberedLogin();
              if (remembered) identifierField.value = remembered;
              const rememberLabel = document.createElement('label');
              rememberLabel.className = 'remember-me-row';
              rememberBox = document.createElement('input');
              rememberBox.type = 'checkbox';
              rememberBox.checked = Boolean(remembered);
              const rememberText = document.createElement('span');
              rememberText.textContent = 'Remember me';
              rememberLabel.append(rememberBox, rememberText);
              form.appendChild(rememberLabel);
            }
            submit.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
            form.appendChild(submit);
            if (mode === 'signin') form.appendChild(forgot);
            if (resendButton) {
              resendButton.remove();
              resendButton = null;
            }
            if (backendReady) {
              status.textContent = mode === 'signup'
                ? 'We will send an email verification link or SMS code, depending on the contact you enter.'
                : 'Sign in with your registered email or phone number.';
            }
          };

          const showSignedIn = (user) => {
            const identifier = String(user.email || user.phone || 'your verified customer account');
            const userName = String(user.user_metadata?.full_name || identifier).split(/\s+/)[0];
            const currentSession = readCustomerSession();
            tabs.hidden = true;
            title.textContent = 'Welcome, ' + userName;
            form.replaceChildren();
            guestNote.hidden = true;
            backToStore.textContent = 'Continue shopping';
            setStatus(card, 'Signed in as ' + identifier + '.', 'success');

            if (currentAccountView) currentAccountView.remove();
            const dashboard = document.createElement('section');
            dashboard.className = 'customer-account-dashboard';
            dashboard.setAttribute('aria-label', 'Customer account');
            const navigation = document.createElement('nav');
            navigation.className = 'customer-account-nav';
            navigation.setAttribute('aria-label', 'Account sections');
            const view = document.createElement('div');
            view.className = 'customer-account-view';
            dashboard.append(navigation, view);
            currentAccountView = dashboard;

            const sections = [
              ['profile', 'My Account'],
              ['orders', 'Order history'],
              ['details', 'Saved details'],
              ['wishlist', 'Wishlist'],
            ];

            const showAccountSection = async (section) => {
              navigation.replaceChildren();
              for (const [key, label] of sections) {
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.textContent = label;
                tab.setAttribute('aria-current', String(section === key));
                tab.addEventListener('click', () => {
                  if (key === 'admin') {
                    if (typeof window.BERRYO_OPEN_ADMIN !== 'function') {
                      setStatus(card, 'The store dashboard could not be opened. Refresh the page and try again.', 'error');
                      return;
                    }
                    window.BERRYO_OPEN_ADMIN();
                    return;
                  }
                  showAccountSection(key);
                });
                navigation.appendChild(tab);
              }
              const logoutButton = document.createElement('button');
              logoutButton.type = 'button';
              logoutButton.className = 'customer-account-logout';
              logoutButton.textContent = 'Logout';
              logoutButton.addEventListener('click', async () => {
                logoutButton.disabled = true;
                try {
                  const session = readCustomerSession();
                  if (session?.accessToken && backendReady) {
                    const response = await fetch(new URL('/auth/v1/logout', config.url), {
                      method: 'POST',
                      headers: {
                        apikey: config.anonKey,
                        Authorization: 'Bearer ' + session.accessToken,
                      },
                    });
                    if (!response.ok) throw new Error('The authentication service did not confirm sign out.');
                  }
                  clearCustomerSession();
                  dashboard.remove();
                  currentAccountView = null;
                  tabs.hidden = false;
                  title.textContent = 'Sign in or create an account';
                  guestNote.hidden = false;
                  updateMode('signin');
                  setStatus(card, 'You have signed out.', 'success');
                } catch (error) {
                  setStatus(card, error.message || 'Could not sign out. Please try again.', 'error');
                  logoutButton.disabled = false;
                }
              });
              navigation.appendChild(logoutButton);
              view.replaceChildren();

              if (section === 'profile') {
                const heading = document.createElement('h4');
                heading.textContent = 'My Account';
                const intro = document.createElement('p');
                intro.textContent = 'Your customer account is signed in and ready for shopping.';
                const email = document.createElement('p');
                email.textContent = user.email ? 'Email: ' + user.email : 'Phone: ' + String(user.phone || '');
                view.append(heading, intro, email);
                return;
              }

              if (section === 'details') {
                const heading = document.createElement('h4');
                heading.textContent = 'Saved details and address';
                const profileForm = document.createElement('form');
                profileForm.className = 'customer-account-profile';
                const name = makeField('text', 'Full name', 'name');
                name.value = String(user.user_metadata?.full_name || '');
                const emailAddress = makeField('email', 'Email address', 'email');
                emailAddress.value = String(user.email || '');
                emailAddress.readOnly = true;
                emailAddress.required = Boolean(user.email);
                emailAddress.setAttribute('aria-label', 'Verified email address');
                const phoneNumber = makeField('tel', 'Phone number', 'tel');
                phoneNumber.value = String(user.phone || user.user_metadata?.phone || '');
                phoneNumber.readOnly = Boolean(user.phone);
                phoneNumber.required = false;
                const address = document.createElement('textarea');
                address.placeholder = 'Saved delivery address';
                address.setAttribute('aria-label', 'Saved delivery address');
                address.autocomplete = 'street-address';
                address.value = String(user.user_metadata?.delivery_address || '');
                const saveDetails = document.createElement('button');
                saveDetails.type = 'submit';
                saveDetails.className = 'primary-btn';
                saveDetails.textContent = 'Save details';
                profileForm.append(name, emailAddress, phoneNumber, address, saveDetails);
                profileForm.addEventListener('submit', async (event) => {
                  event.preventDefault();
                  saveDetails.disabled = true;
                  try {
                    const response = await fetch(new URL('/auth/v1/user', config.url), {
                      method: 'PUT',
                      headers: {
                        apikey: config.anonKey,
                        Authorization: 'Bearer ' + (currentSession?.accessToken || ''),
                        'Content-Type': 'application/json',
                      },
                      body: JSON.stringify({
                        data: {
                          ...user.user_metadata,
                          full_name: name.value.trim(),
                          phone: phoneNumber.value.trim(),
                          delivery_address: address.value.trim(),
                        },
                      }),
                    });
                    const updatedUser = await response.json();
                    if (!response.ok) throw new Error(updatedUser.message || 'Your details could not be saved.');
                    Object.assign(user, updatedUser);
                    title.textContent = 'Welcome, ' + String(updatedUser.user_metadata?.full_name || updatedUser.email || 'customer').split(/\s+/)[0];
                    if (currentSession) {
                      currentSession.user = updatedUser;
                      saveCustomerSession(currentSession);
                    }
                    setHeaderCustomer(updatedUser);
                    setStatus(card, 'Your saved account details have been updated.', 'success');
                  } catch (error) {
                    setStatus(card, error.message || 'Your details could not be saved.', 'error');
                  } finally {
                    saveDetails.disabled = false;
                  }
                });
                view.append(heading, profileForm);
                return;
              }

              if (section === 'orders') {
                const heading = document.createElement('h4');
                heading.textContent = 'Order history';
                const message = document.createElement('p');
                message.textContent = 'Loading your orders…';
                view.append(heading, message);
                if (!currentSession?.accessToken || !user.id) {
                  message.textContent = 'Sign in again to securely view your order history.';
                  return;
                }
                try {
                  const query = new URLSearchParams({
                    select: 'order_code,status,total_ngn,created_at',
                    customer_id: 'eq.' + user.id,
                    order: 'created_at.desc',
                  });
                  const response = await fetch(new URL('/rest/v1/orders?' + query.toString(), config.url), {
                    headers: {
                      apikey: config.anonKey,
                      Authorization: 'Bearer ' + currentSession.accessToken,
                    },
                  });
                  const orders = await response.json();
                  if (!response.ok) throw new Error(orders.message || 'Your orders could not be loaded.');
                  if (!Array.isArray(orders) || orders.length === 0) {
                    message.textContent = 'No account orders yet. Orders placed through guest checkout are not linked to this account.';
                    return;
                  }
                  const list = document.createElement('ul');
                  list.className = 'customer-account-orders';
                  orders.forEach((order) => {
                    const item = document.createElement('li');
                    const code = document.createElement('strong');
                    code.textContent = String(order.order_code || 'Order');
                    const details = document.createElement('span');
                    details.textContent = String(order.status || 'Order received') + ' · ₦' + new Intl.NumberFormat('en-NG').format(Number(order.total_ngn) || 0);
                    item.append(code, details);
                    list.appendChild(item);
                  });
                  message.remove();
                  view.appendChild(list);
                } catch (error) {
                  message.textContent = error.message || 'Your orders could not be loaded.';
                  setStatus(card, message.textContent, 'error');
                }
                return;
              }

              const heading = document.createElement('h4');
              heading.textContent = 'Wishlist';
              const wishlistIds = (() => {
                return window.BERRYO_READ_WISHLIST?.() || [];
              })();
              const wishlistProducts = (window.BERRYO_CATALOG || []).filter((product) => wishlistIds.includes(product.id));
              const intro = document.createElement('p');
              intro.textContent = wishlistProducts.length
                ? 'Products saved in this browser:'
                : 'Your wishlist is empty. Save products from the shop to see them here.';
              view.append(heading, intro);
              wishlistProducts.forEach((product) => {
                const item = document.createElement('p');
                item.textContent = product.name + ' · ₦' + new Intl.NumberFormat('en-NG').format(product.price);
                view.appendChild(item);
              });
            };

            card.appendChild(dashboard);
            showAccountSection('profile');
            setHeaderCustomer(user);

            if (backendReady && currentSession?.accessToken && user.id) {
              fetch(new URL('/rest/v1/profiles?select=is_admin&id=eq.' + encodeURIComponent(user.id), config.url), {
                headers: {
                  apikey: config.anonKey,
                  Authorization: 'Bearer ' + currentSession.accessToken,
                },
              }).then(async (response) => {
                const profiles = await response.json();
                if (!response.ok) {
                  const errorCode = String(profiles.code || '');
                  if (response.status === 404 || errorCode === 'PGRST205') {
                    throw new Error('Supabase cannot find public.profiles. Run supabase-admin-setup.sql in this project, then refresh and sign in again.');
                  }
                  if (response.status === 401 || response.status === 403 || errorCode === '42501') {
                    throw new Error('Supabase denied access to your profile. Confirm the admin setup SQL created the customer profile read policy and grant, then sign in again.');
                  }
                  throw new Error(profiles.message || profiles.msg || 'Supabase returned an error while checking your admin role.');
                }
                if (!Array.isArray(profiles) || profiles.length !== 1) {
                  throw new Error('No Supabase profile was found for this signed-in account. Confirm this is the verified berryorganicskincare@gmail.com account, run the admin setup SQL, then sign in again.');
                }
                if (profiles[0].is_admin !== true) {
                  setStatus(card, 'This account is signed in but does not have store-admin access. Confirm the admin setup SQL was run for this verified email.', 'info');
                  return;
                }
                sections.push(['admin', 'Store admin']);
                showAccountSection('profile');
              }).catch((error) => {
                console.error('BERRYO admin role check failed.', error);
                setStatus(card, error.message || 'You are signed in, but store-admin access could not be verified. Confirm the Supabase setup has been applied.', 'error');
              });
            }
          };

          const restoreCustomerSession = async () => {
            const session = readCustomerSession();
            if (!session?.accessToken || !backendReady) return;
            if (Number(session.expiresAt) <= Date.now()) {
              clearCustomerSession();
              setStatus(card, 'Your sign-in session expired. Please sign in again.', 'info');
              return;
            }
            try {
              const response = await fetch(new URL('/auth/v1/user', config.url), {
                headers: {
                  apikey: config.anonKey,
                  Authorization: 'Bearer ' + session.accessToken,
                },
              });
              const user = await response.json();
              if (!response.ok) throw new Error(user.message || 'Your customer session is no longer valid.');
              showSignedIn(user);
            } catch (error) {
              clearCustomerSession();
              setStatus(card, error.message || 'Your sign-in session could not be restored. Please sign in again.', 'info');
            }
          };

          const showResend = () => {
            if (resendButton) return;
            resendButton = document.createElement('button');
            resendButton.type = 'button';
            resendButton.className = 'secondary-btn small customer-auth-secondary';
            const phonePending = mode === 'verify-phone' || Boolean(pendingPhone);
            resendButton.textContent = phonePending ? 'Resend SMS code' : 'Resend verification email';
            resendButton.addEventListener('click', async () => {
              const identity = phonePending
                ? { type: 'sms', phone: pendingPhone }
                : { type: 'signup', email: identifierField.value.trim() };
              if (!identity.phone && !identity.email) {
                setStatus(card, 'Enter your email address first.', 'error');
                identifierField.focus();
                return;
              }
              resendButton.disabled = true;
              try {
                const response = await fetch(new URL('/auth/v1/resend', config.url), {
                  method: 'POST',
                  headers: { apikey: config.anonKey, 'Content-Type': 'application/json' },
                  body: JSON.stringify(identity.phone
                    ? { type: 'sms', phone: identity.phone }
                    : { type: identity.type, email: identity.email }),
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.msg || result.message || 'Could not resend the verification email.');
                setStatus(card, identity.phone
                  ? 'If that phone number needs verification, a new SMS code has been sent.'
                  : 'If that account needs verification, a new email has been sent. Check your inbox and spam folder.', 'success');
              } catch (error) {
                setStatus(card, error.message || 'Could not resend the verification email.', 'error');
              } finally {
                resendButton.disabled = false;
              }
            });
            form.appendChild(resendButton);
          };

          const showPhoneVerificationPrompt = (phone, message) => {
            pendingPhone = phone;
            mode = 'verify-phone';
            form.replaceChildren();
            verificationCodeField = makeField('text', 'SMS verification code', 'one-time-code');
            verificationCodeField.inputMode = 'numeric';
            verificationCodeField.pattern = '[0-9]{6,8}';
            verificationCodeField.maxLength = 8;
            submit.textContent = 'Verify phone';
            form.append(verificationCodeField, submit);
            setStatus(card, message, 'info');
            showResend();
          };

          signInTab.addEventListener('click', () => updateMode('signin'));
          createTab.addEventListener('click', () => updateMode('signup'));
          forgot.addEventListener('click', () => {
            if (!backendReady) {
              setStatus(card, 'Password reset is unavailable until customer authentication is configured.', 'error');
              return;
            }
            if (!identifierField.value.trim().includes('@')) {
              setStatus(card, 'Enter the email address on your account to receive a password reset link.', 'error');
              identifierField.focus();
              return;
            }
            form.replaceChildren(identifierField);
            identifierField.required = true;
            const sendReset = document.createElement('button');
            sendReset.type = 'submit';
            sendReset.className = 'primary-btn';
            sendReset.textContent = 'Send password reset email';
            const returnToSignIn = document.createElement('button');
            returnToSignIn.type = 'button';
            returnToSignIn.className = 'text-link auth-link customer-auth-secondary';
            returnToSignIn.textContent = 'Back to sign in';
            returnToSignIn.addEventListener('click', () => updateMode('signin'));
            form.append(sendReset, returnToSignIn);
            mode = 'recover';
            setStatus(card, 'Enter the email address for your account. We will send a password reset link.', 'info');
          });

          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!backendReady) {
              setStatus(card, 'Customer sign-in is not available yet. Your password was not sent.', 'error');
              return;
            }
            const identifier = identifierField.value.trim();
            const identity = identifier.includes('@')
              ? { email: identifier }
              : { phone: normalizePhoneIdentifier(identifier) };
            const password = passwordField?.value || '';
            if (mode === 'signup' && password !== confirmPasswordField.value) {
              setStatus(card, 'The passwords do not match. Please confirm your password again.', 'error');
              confirmPasswordField.focus();
              return;
            }
            if (mode === 'reset-password' && resetPasswordField.value !== resetConfirmField.value) {
              setStatus(card, 'The passwords do not match. Please confirm your new password again.', 'error');
              resetConfirmField.focus();
              return;
            }
            if (mode === 'signup' && !identity.email && !/^\+[1-9]\d{7,14}$/.test(identity.phone)) {
              setStatus(card, 'Enter a phone number in international format, including the + and country code, or use an email address.', 'error');
              identifierField.focus();
              return;
            }
            const activeSubmit = form.querySelector('button[type="submit"]');
            if (activeSubmit) activeSubmit.disabled = true;
            try {
              const redirectTo = new URL('./index.html', window.location.href).href;
              if (mode === 'verify-phone') {
                const verifyResponse = await fetch(new URL('/auth/v1/verify', config.url), {
                  method: 'POST',
                  headers: { apikey: config.anonKey, 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    type: 'sms',
                    phone: pendingPhone,
                    token: verificationCodeField.value.trim(),
                  }),
                });
                const verifyResult = await verifyResponse.json();
                if (!verifyResponse.ok) throw new Error(verifyResult.msg || verifyResult.message || 'The SMS verification code could not be confirmed.');
                const verifiedUser = verifyResult.user || { phone: pendingPhone };
                if (!verifyResult.access_token) throw new Error('The phone was verified, but no customer session was returned. Please sign in.');
                const saved = saveCustomerSession({
                  accessToken: verifyResult.access_token,
                  expiresAt: Date.now() + (Number(verifyResult.expires_in) || 3600) * 1000,
                  user: verifiedUser,
                });
                showSignedIn(verifiedUser);
                if (!saved) setStatus(card, 'Your phone is verified, but this browser could not retain your session. Sign in again if you refresh.', 'error');
                return;
              }
              if (mode === 'reset-password') {
                const response = await fetch(new URL('/auth/v1/user', config.url), {
                  method: 'PUT',
                  headers: {
                    apikey: config.anonKey,
                    Authorization: 'Bearer ' + recoveryAccessToken,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ password: resetPasswordField.value }),
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || 'Your password could not be changed.');
                recoveryAccessToken = '';
                clearCustomerSession();
                tabs.hidden = false;
                title.textContent = 'Sign in or create an account';
                updateMode('signin');
                setStatus(card, 'Your password has been changed. Sign in with your new password.', 'success');
                return;
              }
              const endpoint = mode === 'signup'
                ? new URL('/auth/v1/signup?redirect_to=' + encodeURIComponent(redirectTo), config.url)
                : mode === 'recover'
                  ? new URL('/auth/v1/recover?redirect_to=' + encodeURIComponent(redirectTo), config.url)
                  : new URL('/auth/v1/token?grant_type=password', config.url);
              const authBody = mode === 'signup'
                ? { ...identity, password, data: { full_name: nameField.value.trim() } }
                : mode === 'recover'
                  ? { email: identifier }
                  : { ...identity, password };
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: { apikey: config.anonKey, 'Content-Type': 'application/json' },
                body: JSON.stringify(authBody),
              });
              const result = await response.json();
              if (!response.ok) {
                const errorCode = String(result.code || result.error || '').toLowerCase();
                const errorMessage = String(result.msg || result.message || result.error_description || 'Authentication failed.');
                if (mode === 'signin' && (errorCode.includes('email_not_confirmed') || errorMessage.toLowerCase().includes('email not confirmed'))) {
                  setStatus(card, 'Verify your email before signing in. Check your inbox or request a new verification email.', 'error');
                  showResend();
                  return;
                }
                if (mode === 'signin' && identity.phone
                  && (errorCode.includes('phone_not_confirmed') || errorMessage.toLowerCase().includes('phone not confirmed'))) {
                  showPhoneVerificationPrompt(identity.phone, 'Verify your phone before signing in. Request a new SMS code and enter it to continue.');
                  return;
                }
                throw new Error(errorMessage);
              }
              if (mode === 'signup') {
                if (result.session || result.access_token || result.user?.email_confirmed_at || result.user?.confirmed_at) {
                  throw new Error('Contact verification is not being enforced by the authentication service. Require email confirmation and phone verification in the Supabase Auth settings before allowing customer registration.');
                }
                if (identity.phone) {
                  showPhoneVerificationPrompt(identity.phone, 'Account created. Enter the verification code sent to ' + identity.phone + '.');
                  setStatus(card, 'Account created. Enter the verification code sent to ' + identity.phone + '.', 'success');
                  return;
                }
                updateMode('signin');
                identifierField.value = identifier;
                setStatus(card, 'Account created. Check your email for a verification link before signing in.', 'success');
                return;
              }
              if (mode === 'recover') {
                updateMode('signin');
                identifierField.value = identifier;
                setStatus(card, 'If an account exists for that address, a password reset email has been sent.', 'success');
                return;
              }
              const signedInUser = result.user || { ...identity };
              if (identity.email && !signedInUser.email_confirmed_at && !signedInUser.confirmed_at) {
                setStatus(card, 'Verify your email before signing in. Check your inbox or request a new verification email.', 'error');
                showResend();
                return;
              }
              if (identity.phone && !signedInUser.phone_confirmed_at && !signedInUser.confirmed_at) {
                showPhoneVerificationPrompt(identity.phone, 'Verify your phone before signing in. Request a new SMS code and enter it to continue.');
                setStatus(card, 'Verify your phone before signing in. Request a new SMS code and enter it to continue.', 'error');
                return;
              }
              const expiresAt = Date.now() + (Number(result.expires_in) || 3600) * 1000;
              const sessionSaved = saveCustomerSession({
                accessToken: result.access_token,
                expiresAt,
                user: signedInUser,
              });
              showSignedIn(signedInUser);
              if (!sessionSaved) {
                setStatus(card, 'You are signed in for this page, but the browser could not retain your session. Refreshing will require another sign-in.', 'error');
              }
            } catch (error) {
              setStatus(card, error.message || 'Authentication failed. Please try again.', 'error');
            } finally {
              if (activeSubmit) activeSubmit.disabled = false;
            }
          });

          tabs.append(signInTab, createTab);
          card.append(eyebrow, title, tabs, status, form, guestNote, backToStore);
          updateMode('signin');
          const callback = new URLSearchParams(window.location.hash.slice(1));
          if (callback.get('type') === 'signup' && callback.get('access_token')) {
            const accessToken = callback.get('access_token');
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
            if (!backendReady) {
              setStatus(card, 'Email verification could not be checked because customer authentication is not configured.', 'error');
              return;
            }
            setStatus(card, 'Checking your email verification…', 'info');
            fetch(new URL('/auth/v1/user', config.url), {
              headers: { apikey: config.anonKey, Authorization: 'Bearer ' + accessToken },
            }).then(async (response) => {
              const user = await response.json();
              if (!response.ok) throw new Error(user.message || 'We could not verify this email confirmation.');
              if (!user.email_confirmed_at && !user.confirmed_at) {
                throw new Error('Your email has not been confirmed. Request a new verification email and try again.');
              }
              setStatus(card, 'Your email has been verified. You can now sign in.', 'success');
            }).catch((error) => {
              setStatus(card, error.message || 'We could not verify this email confirmation.', 'error');
            });
          } else if (callback.get('type') === 'recovery' && callback.get('access_token')) {
            recoveryAccessToken = callback.get('access_token');
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
            if (!backendReady) {
              setStatus(card, 'Password reset cannot continue because customer authentication is not configured.', 'error');
              return;
            }
            tabs.hidden = true;
            title.textContent = 'Choose a new password';
            mode = 'reset-password';
            form.replaceChildren();
            resetPasswordField = makeField('password', 'New password (at least 8 characters)', 'new-password');
            resetConfirmField = makeField('password', 'Confirm new password', 'new-password');
            submit.textContent = 'Save new password';
            form.append(resetPasswordField, resetConfirmField, submit);
            addPasswordToggle(resetPasswordField);
            addPasswordToggle(resetConfirmField);
            setStatus(card, 'Choose a new password for your customer account.', 'info');
          } else if (callback.get('error_code') === 'otp_expired') {
            setStatus(card, 'This email link has expired or was already used. Enter the registered email above and select “Resend verification email” to request a fresh link.', 'error');
            showResend();
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
          } else if (callback.get('error_description')) {
            setStatus(card, callback.get('error_description').replace(/\+/g, ' '), 'error');
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
          } else restoreCustomerSession();
        };

        let checkoutInProgress = false;
        const bankTransferDetails = (settings = window.BERRYO_STORE_CONTENT?.payment || {}) => [
          'Payment method: ' + String(settings.method || 'moniepoint_transfer').replace(/_/g, ' '),
          'Bank: ' + String(settings.bank_name || 'Moniepoint'),
          'Account name: ' + String(settings.account_name || 'BERRY0-ORGANICSKINCARE ENTERPRISE'),
          'Account number: ' + String(settings.account_number || '8034226547'),
        ].join('\n');
        const prepareCheckout = () => {
          const form = document.querySelector('#cart-page .checkout-form');
          const panel = form?.closest('.cart-checkout-panel');
          if (!form || !panel) return;

          const payment = form.querySelector('select');
          if (payment && payment.dataset.berryoBankTransfer !== 'true') {
            const option = document.createElement('option');
            option.value = 'bank_transfer';
            option.textContent = 'Moniepoint bank transfer';
            payment.replaceChildren(option);
            payment.dataset.berryoBankTransfer = 'true';
            payment.value = 'bank_transfer';
            payment.dispatchEvent(new Event('change', { bubbles: true }));
          }

          if (!panel.querySelector('.berryo-bank-transfer')) {
            const details = document.createElement('section');
            details.className = 'auth-copy berryo-bank-transfer';
            details.setAttribute('aria-label', 'Moniepoint bank transfer details');
            const heading = document.createElement('strong');
            heading.textContent = 'Pay by ' + String(window.BERRYO_STORE_CONTENT?.payment?.bank_name || 'Moniepoint') + ' transfer';
            const instructions = document.createElement('p');
            const customerSession = readCustomerSession();
            instructions.textContent = customerSession?.accessToken
              ? 'Transfer after your order is saved. Use the order reference as the transfer narration, then upload your receipt and transfer reference below. Orders remain unpaid until BERRYO confirms the transfer.'
              : 'Guest checkout is available through WhatsApp. Sign in before ordering to save the order and submit your transfer receipt online. Orders remain unpaid until BERRYO confirms the transfer.';
            const account = document.createElement('pre');
            account.textContent = bankTransferDetails();
            details.append(heading, instructions, account);
            form.insertAdjacentElement('beforebegin', details);
          }
        };

        const checkoutStatus = (form, message, isError) => {
          let status = form.querySelector('.customer-order-status');
          if (!status) {
            status = document.createElement('p');
            status.className = 'customer-order-status auth-copy';
            status.setAttribute('role', 'status');
            form.appendChild(status);
          }
          status.textContent = message;
          status.dataset.kind = isError ? 'error' : 'success';
        };

        const makePaymentProofForm = (orderId, orderReference, total) => {
          const session = readCustomerSession();
          const proofSection = document.createElement('section');
          proofSection.className = 'berryo-payment-proof';
          proofSection.setAttribute('aria-label', 'Submit Moniepoint payment proof');

          const heading = document.createElement('h3');
          heading.textContent = 'Submit your Moniepoint transfer';
          const instructions = document.createElement('p');
          instructions.textContent = `Order ${orderReference} · Amount ${total}. After transferring, enter the bank reference and attach your receipt. BERRYO will confirm the payment before processing your order.`;

          const proofForm = document.createElement('form');
          const referenceLabel = document.createElement('label');
          referenceLabel.textContent = 'Moniepoint transfer reference';
          const referenceInput = document.createElement('input');
          referenceInput.name = 'payment_reference';
          referenceInput.required = true;
          referenceInput.minLength = 3;
          referenceInput.maxLength = 120;
          referenceInput.autocomplete = 'off';
          referenceInput.placeholder = 'Enter the transaction reference';
          referenceLabel.appendChild(referenceInput);

          const receiptLabel = document.createElement('label');
          receiptLabel.textContent = 'Transfer receipt (image or PDF, max 5 MB)';
          const receiptInput = document.createElement('input');
          receiptInput.name = 'payment_receipt';
          receiptInput.type = 'file';
          receiptInput.accept = 'image/jpeg,image/png,image/webp,application/pdf';
          receiptInput.required = true;
          receiptLabel.appendChild(receiptInput);

          const submit = document.createElement('button');
          submit.className = 'primary-btn small';
          submit.type = 'submit';
          submit.textContent = 'Submit payment proof';
          const status = document.createElement('p');
          status.className = 'customer-order-status';
          status.setAttribute('role', 'status');
          status.hidden = true;
          proofForm.append(referenceLabel, receiptLabel, submit, status);
          proofSection.append(heading, instructions, proofForm);

          proofForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (submit.disabled) return;
            const file = receiptInput.files?.[0];
            const paymentReference = referenceInput.value.trim();
            if (!session?.accessToken || Number(session.expiresAt) <= Date.now()) {
              status.textContent = 'Your sign-in session expired. Sign in again before submitting payment proof.';
              status.dataset.kind = 'error';
              status.hidden = false;
              return;
            }
            if (!file || !['image/jpeg', 'image/png', 'image/webp', 'application/pdf'].includes(file.type) || file.size > 5 * 1024 * 1024) {
              status.textContent = 'Choose a JPG, PNG, WEBP, or PDF receipt smaller than 5 MB.';
              status.dataset.kind = 'error';
              status.hidden = false;
              return;
            }
            if (paymentReference.length < 3 || paymentReference.length > 120) {
              status.textContent = 'Enter a transfer reference between 3 and 120 characters.';
              status.dataset.kind = 'error';
              status.hidden = false;
              return;
            }

            submit.disabled = true;
            status.textContent = 'Uploading your receipt securely…';
            status.dataset.kind = 'info';
            status.hidden = false;
            try {
              const extensionByType = {
                'image/jpeg': 'jpg',
                'image/png': 'png',
                'image/webp': 'webp',
                'application/pdf': 'pdf',
              };
              const proofPath = `${orderId}/${session.user.id}/${crypto.randomUUID()}.${extensionByType[file.type]}`;
              const encodedPath = proofPath.split('/').map(encodeURIComponent).join('/');
              const uploadResponse = await fetch(new URL(`/storage/v1/object/customer-payment-proofs/${encodedPath}`, config.url), {
                method: 'POST',
                headers: {
                  apikey: config.anonKey,
                  Authorization: 'Bearer ' + session.accessToken,
                  'Content-Type': file.type,
                  'x-upsert': 'false',
                },
                body: file,
              });
              const uploadResult = await uploadResponse.json().catch(() => ({}));
              if (!uploadResponse.ok) throw new Error(uploadResult.message || 'The receipt could not be uploaded.');

              const proofResponse = await fetch(new URL('/rest/v1/rpc/submit_order_payment_proof', config.url), {
                method: 'POST',
                headers: {
                  apikey: config.anonKey,
                  Authorization: 'Bearer ' + session.accessToken,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  p_order_id: orderId,
                  p_payment_reference: paymentReference,
                  p_proof_path: proofPath,
                }),
              });
              const proofResult = await proofResponse.json().catch(() => ({}));
              if (!proofResponse.ok) throw new Error(proofResult.message || 'Your payment proof could not be submitted.');

              status.textContent = 'Payment proof submitted. Your order will remain unpaid until BERRYO verifies the transfer.';
              status.dataset.kind = 'success';
              referenceInput.disabled = true;
              receiptInput.disabled = true;
              submit.textContent = 'Proof submitted';
            } catch (error) {
              status.textContent = error.message || 'Payment proof could not be submitted. Please try again.';
              status.dataset.kind = 'error';
              submit.disabled = false;
            }
          });

          return proofSection;
        };

        const checkoutItems = () => {
          const catalog = window.BERRYO_CATALOG || [];
          return Array.from(document.querySelectorAll('#cart-page .cart-item-page')).map((row) => {
            const name = row.querySelector('.cart-item-info h4')?.textContent.trim();
            const quantity = Number(row.querySelector('.quantity-row span')?.textContent);
            const product = catalog.find((item) => item.name === name);
            if (!product || !Number.isInteger(quantity) || quantity < 1 || quantity > 99) {
              throw new Error('A cart item could not be verified. Refresh the store and try again.');
            }
            return { slug: product.id, quantity, name: product.name };
          });
        };

        const openWhatsAppCheckout = (popup, message) => {
          const url = new URL('https://wa.me/2348034226547');
          url.searchParams.set('text', message);
          popup.opener = null;
          popup.location.replace(url.toString());
        };

        document.addEventListener('submit', async (event) => {
          const form = event.target;
          if (!(form instanceof HTMLFormElement) || !form.matches('#cart-page .checkout-form')) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          if (checkoutInProgress) return;

          const popup = window.open('', '_blank');
          if (!popup) {
            checkoutStatus(form, 'Allow pop-ups for this store to open your WhatsApp order securely.', true);
            return;
          }

          checkoutInProgress = true;
          const submit = form.querySelector('button[type="submit"]');
          if (submit) submit.disabled = true;

          try {
            const fullName = form.querySelector('input[placeholder="Full name"]')?.value.trim() || '';
            const email = form.querySelector('input[placeholder="Email"]')?.value.trim() || '';
            const phone = form.querySelector('input[placeholder="Phone"]')?.value.trim() || '';
            const address = form.querySelector('input[placeholder="Delivery address"]')?.value.trim() || '';
            const items = checkoutItems();
            const session = readCustomerSession();
            const customer = window.BERRYO_CUSTOMER_PROFILE || session?.user;
            let orderReference = '';
            let orderId = '';
            let orderSaveUnavailable = false;
            let total = '';
            let shippingFee = Number(window.BERRYO_STORE_CONTENT?.shipping?.fee_ngn) || 0;

            if (session?.accessToken && Number(session.expiresAt) <= Date.now()) {
              throw new Error('Your sign-in session expired. Sign in again before placing an account order.');
            }

            if (session?.accessToken && customer?.id) {
              const response = await fetch(new URL('/rest/v1/rpc/create_customer_order', config.url), {
                method: 'POST',
                headers: {
                  apikey: config.anonKey,
                  Authorization: 'Bearer ' + session.accessToken,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  p_customer_name: fullName,
                  p_customer_phone: phone,
                  p_delivery_address: address,
                  p_items: items.map(({ slug, quantity }) => ({ slug, quantity })),
                }),
              });
              const result = await response.json();
              if (!response.ok && ['PGRST202', 'PGRST205'].includes(result.code)) {
                orderSaveUnavailable = true;
              } else if (!response.ok) {
                throw new Error(result.message || 'Your order could not be saved. Please try again.');
              }
              if (!orderSaveUnavailable && (!result?.order_id || !result?.order_code || !Number.isFinite(Number(result.total_ngn)))) {
                throw new Error('The order service returned an invalid confirmation. Please contact BERRYO before retrying.');
              }
              if (!orderSaveUnavailable) {
                orderId = String(result.order_id);
                orderReference = String(result.order_code);
                shippingFee = Number(result.shipping_fee_ngn) || shippingFee;
                total = '₦' + new Intl.NumberFormat('en-NG').format(Number(result.total_ngn));
              }
            }

            const itemSummary = items.map((item) => `${item.quantity} Ã— ${item.name}`).join(', ');
            const message = [
              'Hello BERRYO Organic Skincare, I would like to place an order.',
              orderReference ? `Order reference: ${orderReference}.` : orderSaveUnavailable
                ? 'The website order service is unavailable. Please confirm this order in WhatsApp; it was not saved online.'
                : 'Guest checkout (not linked to an account order history).',
              `Name: ${fullName}`,
              `Email: ${email}`,
              `Phone: ${phone}`,
              `Delivery address: ${address}`,
              `Items: ${itemSummary}`,
              total ? `Order total (includes ${'₦' + new Intl.NumberFormat('en-NG').format(shippingFee)} delivery): ${total}` : '',
              bankTransferDetails(),
              orderReference ? `Use ${orderReference} as the bank transfer narration.` : `Use ${fullName} ${phone} as the bank transfer narration.`,
              orderSaveUnavailable
                ? 'Please confirm availability and the bank transfer details in WhatsApp. Send the transfer receipt there; this site cannot record payment proof until its database is restored.'
                : 'Please confirm availability and payment before dispatch.',
            ].filter(Boolean).join('\n');

            openWhatsAppCheckout(popup, message);
            checkoutStatus(
              form,
              orderReference
                ? `Order ${orderReference} has been saved. Continue in WhatsApp, then transfer and submit the receipt below.`
                : orderSaveUnavailable
                  ? 'The online order service is unavailable. Continue in WhatsApp to place this order manually; it has not been saved online.'
                : 'Continue in WhatsApp to confirm your guest order. Sign in next time to keep purchases in your account history.',
              false,
            );
            if (orderId && orderReference) {
              localStorage.setItem('berryo-cart', '[]');
              if (submit) {
                submit.textContent = 'Order saved';
                submit.disabled = true;
              }
              const oldProofForm = document.querySelector('.berryo-payment-proof');
              oldProofForm?.remove();
              const proofForm = makePaymentProofForm(orderId, orderReference, total);
              form.insertAdjacentElement('afterend', proofForm);
              proofForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (submit) submit.textContent = 'Order sent to WhatsApp';
          } catch (error) {
            popup.close();
            checkoutInProgress = false;
            if (submit) submit.disabled = false;
            checkoutStatus(form, error.message || 'Your order could not be processed. Please try again.', true);
          }
        }, true);

        const checkoutObserver = new MutationObserver(prepareCheckout);
        checkoutObserver.observe(document.body, { childList: true, subtree: true });
        prepareCheckout();

        const syncSignInHeader = () => {
          const authPage = document.querySelector('#login-page');
          const showSignInForm = authPage && !authPage.querySelector('.customer-account-dashboard');
          document.body.classList.toggle('berryo-sign-in-active', Boolean(showSignInForm));
        };
        const signInPageObserver = new MutationObserver(syncSignInHeader);
        signInPageObserver.observe(document.body, { childList: true, subtree: true });
        syncSignInHeader();

        const authObserver = new MutationObserver(() => {
          document.querySelectorAll('#login-page .auth-card').forEach(renderCustomerAuth);
        });
        authObserver.observe(document.body, { childList: true, subtree: true });
        document.querySelectorAll('#login-page .auth-card').forEach(renderCustomerAuth);
      })();
    </script>
    
  </body>
</html>
