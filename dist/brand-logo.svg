<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-labelledby="title desc">
  <title id="title">BERRYO ORGANIC SKINCARE logo</title>
  <desc id="desc">Premium BERRYO organic skincare brand logo with a botanical emblem and elegant wordmark</desc>
  <defs>
    <linearGradient id="rose" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5dfe4"/>
      <stop offset="100%" stop-color="#e8b7b0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f3d7a2"/>
      <stop offset="100%" stop-color="#c48946"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8ea97d"/>
      <stop offset="100%" stop-color="#415f49"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#664d41" flood-opacity="0.13"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="12" y="18" width="140" height="140" rx="36" fill="#fffaf7"/>
    <circle cx="82" cy="88" r="52" fill="#fffdfb" stroke="url(#gold)" stroke-width="3.5"/>
    <path d="M82 33c-18 0-32 12-32 28 0 12 8 19 18 24 8 4 13 8 13 16 0 10-9 17-21 17-11 0-20-5-26-15l-12 8c8 15 23 25 39 25 20 0 35-12 35-30 0-14-9-23-23-29-8-3-13-7-13-13 0-8 8-13 18-13 10 0 18 4 25 12l11-8c-9-13-21-19-35-19z" fill="url(#leaf)"/>
    <path d="M98 62c15-11 26-27 29-42 1-4-1-8-6-9 7 6 11 15 11 25 0 18-13 31-34 36z" fill="url(#gold)" opacity="0.95"/>
    <path d="M76 113c11-3 20 0 25 9 5 8 5 16-2 22-11 10-31 9-39-2-7-10-2-22 16-29z" fill="url(#rose)" opacity="0.9"/>
  </g>

  <g transform="translate(180 28)">
    <text x="0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="2" fill="#3d2b26">BERRYO</text>
    <text x="2" y="89" font-family="Arial, sans-serif" font-size="16" letter-spacing="7" fill="#6a7f64">ORGANIC SKINCARE</text>
    <line x1="0" y1="108" x2="286" y2="108" stroke="#d6b06a" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="136" font-family="Arial, sans-serif" font-size="11" letter-spacing="3.5" fill="#8b6b4f">PURELY ORGANIC • NATURALLY BEAUTIFUL</text>
  </g>
</svg>
