<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf7f4" />
    <title>Store Admin | BERRYO</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./admin.css" />
    <script src="./supabase-config.js"></script>
    <script defer src="./admin.js"></script>
  </head>
  <body>
    <div class="admin-app">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="./index.html" aria-label="BERRYO storefront">
          <img src="./berryo-logo.png" alt="" />
          <span><strong>BERRYO</strong><small>STORE ADMIN</small></span>
        </a>
        <nav class="side-nav" aria-label="Admin sections">
          <button class="nav-item active" data-view="overview"><span>⌂</span>Overview</button>
          <button class="nav-item" data-view="products"><span>◇</span>Products</button>
          <button class="nav-item" data-view="orders"><span>▤</span>Orders</button>
          <button class="nav-item" data-view="customers"><span>♙</span>Customers</button>
          <button class="nav-item" data-view="content"><span>▧</span>Website content</button>
          <button class="nav-item" data-view="settings"><span>⚙</span>Settings</button>
        </nav>
        <div class="sidebar-bottom">
          <a class="store-link" href="./index.html">↗ <span>View storefront</span></a>
          <button class="logout-button" id="logout">↪ <span>Sign out</span></button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="icon-button menu-button" id="menu-toggle" aria-label="Open navigation">☰</button>
          <div class="crumb"><span>BerryO</span><b>/</b><strong id="current-section">Overview</strong></div>
          <div class="top-actions">
            <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="global-search" type="search" placeholder="Search this section" aria-label="Search current section" /></label>
            <button class="icon-button notification-button" id="notifications" aria-label="Low-stock products">♧<i id="low-stock-count" hidden></i></button>
            <div class="admin-identity"><span class="avatar" id="avatar">B</span><span><strong id="admin-name">Store admin</strong><small id="admin-email"></small></span></div>
          </div>
        </header>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="loading" class="loading-state">Connecting securely to your store…</div>
        <section id="view" class="view-content" aria-live="polite"></section>
      </main>
    </div>
    <div id="scrim" class="scrim"></div>
    <dialog id="product-dialog" class="product-dialog"></dialog>
  </body>
</html>
